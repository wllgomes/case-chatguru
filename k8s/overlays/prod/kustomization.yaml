apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: case-chatguru-prod
namePrefix: prod-

resources:
  - ../../base

patches:
  - path: patch-deployment.yaml
  - path: patch-ingress.yaml

configMapGenerator:
  - name: case-chatguru-config
    behavior: merge
    literals:
      - APP_ENV=prod

images:
  - name: ghcr.io/wllgomes/case-chatguru
    newTag: sha-2953c21