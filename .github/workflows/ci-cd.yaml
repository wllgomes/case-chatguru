name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_IMAGE: ghcr.io/wllgomes/case-chatguru

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Rodar pytest
        run: pytest -v

  validate-manifests:
    name: Validar manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Instalar kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validar overlays contra o schema da API do Kubernetes
        run: |
          for target in k8s/base k8s/overlays/stg k8s/overlays/prod k8s/overlays/stg-aws k8s/overlays/prod-aws; do
            echo "::group::$target"
            kubectl kustomize "$target" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0 -
            echo "::endgroup::"
          done

  publish:
    name: Publicar imagem no GHCR
    needs: [test, validate-manifests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-stg-aws:
    name: Deploy stg no servidor de demonstração (AWS)
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEMO_HOST: ${{ vars.AWS_DEMO_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar acesso SSH
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.AWS_DEMO_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEMO_HOST" >> ~/.ssh/known_hosts

      - name: Copiar manifests e scripts para o servidor
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$DEMO_HOST" "rm -rf /tmp/case-chatguru-deploy && mkdir -p /tmp/case-chatguru-deploy"
          scp -i ~/.ssh/id_ed25519 -r k8s scripts ubuntu@"$DEMO_HOST":/tmp/case-chatguru-deploy/

      - name: Deploy no ambiente stg
        run: |
          SHA_TAG="${LOCAL_IMAGE}:sha-${GITHUB_SHA:0:7}"
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$DEMO_HOST" \
            "cd /tmp/case-chatguru-deploy && OVERLAY_DIR=k8s/overlays/stg-aws IMAGE=$SHA_TAG ./scripts/deploy.sh stg"

      - name: Smoke test do ambiente stg
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$DEMO_HOST" \
            "cd /tmp/case-chatguru-deploy && INGRESS_URL=https://case-chatguru-stg.duckdns.org INGRESS_HOST=case-chatguru-stg.duckdns.org ./scripts/smoke-test.sh stg"

      - name: Verificar acesso público (HTTPS real)
        run: curl -sS --fail --retry 5 --retry-delay 3 https://case-chatguru-stg.duckdns.org/health

      - name: Coletar diagnóstico em caso de falha
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$DEMO_HOST" '
            set +e
            echo "::group::Namespace case-chatguru-stg"
            kubectl -n case-chatguru-stg get all,ingress,configmap,certificate
            kubectl -n case-chatguru-stg describe pods
            kubectl -n case-chatguru-stg logs -l app=case-chatguru --tail=100 --all-containers
            echo "::endgroup::"
          '

  deploy-prod-aws:
    name: Deploy prod no servidor de demonstração (AWS)
    needs: [deploy-stg-aws]
    runs-on: ubuntu-latest
    environment: production
    env:
      DEMO_HOST: ${{ vars.AWS_DEMO_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar acesso SSH
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.AWS_DEMO_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEMO_HOST" >> ~/.ssh/known_hosts

      - name: Copiar manifests e scripts para o servidor
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$DEMO_HOST" "rm -rf /tmp/case-chatguru-deploy && mkdir -p /tmp/case-chatguru-deploy"
          scp -i ~/.ssh/id_ed25519 -r k8s scripts ubuntu@"$DEMO_HOST":/tmp/case-chatguru-deploy/

      - name: Deploy no ambiente prod
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$DEMO_HOST" \
            "cd /tmp/case-chatguru-deploy && OVERLAY_DIR=k8s/overlays/prod-aws ./scripts/deploy.sh prod"

      - name: Smoke test do ambiente prod
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$DEMO_HOST" \
            "cd /tmp/case-chatguru-deploy && INGRESS_URL=https://case-chatguru-prod.duckdns.org INGRESS_HOST=case-chatguru-prod.duckdns.org ./scripts/smoke-test.sh prod"

      - name: Verificar acesso público (HTTPS real)
        run: curl -sS --fail --retry 5 --retry-delay 3 https://case-chatguru-prod.duckdns.org/health

      - name: Coletar diagnóstico em caso de falha
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$DEMO_HOST" '
            set +e
            echo "::group::Namespace case-chatguru-prod"
            kubectl -n case-chatguru-prod get all,ingress,configmap,certificate
            kubectl -n case-chatguru-prod describe pods
            kubectl -n case-chatguru-prod logs -l app=case-chatguru --tail=100 --all-containers
            echo "::endgroup::"
          '
